# ============================================================
# CheckedIn backend settings
# Values like ${DB_PASSWORD:} come from backend/.env (not committed).
# The text after ":" is the default used when .env has no value.
# ============================================================
spring.application.name=checkedin-backend

# Load local secrets from backend/.env (copy .env.example to start)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ---------- Database: PostgreSQL on Supabase ----------
# Copy the "Session pooler" connection details from Supabase into backend/.env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Supabase's free plan allows only a few connections, so keep the pool small
spring.datasource.hikari.maximum-pool-size=5

# ---------- JPA / Hibernate ----------
# "update" creates and updates tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila
# Set to true to print SQL in the console while debugging
spring.jpa.show-sql=false

# ---------- Email: Brevo ----------
# Values come from backend/.env (see README, "Set up Brevo"). They are empty by default, so the
# app still starts without Brevo; sending an email then fails with a clear "not set up" message.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:CheckedIn}

# ---------- Sign-in (Feature 1) ----------
# Only these email domains may sign in (FR-002). Comma-separated, without the "@".
checkedin.auth.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:cit.edu}

# Emailed sign-in codes (NFR-008)
checkedin.login-code.expiry-minutes=10
checkedin.login-code.max-wrong-tries=5
checkedin.login-code.max-requests=3
checkedin.login-code.request-window-minutes=15

# Sign in with GitHub (FR-001, NFR-008). Client ID and secret come from backend/.env
# (see README, "Set up GitHub sign-in"). The placeholders only let the app start without them;
# the GitHub button does not work until the real values are set.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-set-see-README}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-set-see-README}
# Only permission we ask for: read the list of email addresses on the GitHub account
spring.security.oauth2.client.registration.github.scope=user:email

# We have our own sign-in, so turn off Spring Security's built-in user with a generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- Session cookie (NFR-009): HttpOnly, Secure, SameSite, expires after 8 hours ----------
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=CHECKEDIN_SESSION
server.servlet.session.cookie.max-age=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
# Keep the session ID only in the cookie, never in the URL
server.servlet.session.tracking-modes=cookie
